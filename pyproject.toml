[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpsec"
version = "0.1.0a2"
description = "CLI-first security scanner for MCP (Model Context Protocol) configurations."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "agentx", email = "adz9596@gmail.com" }]
keywords = ["mcp", "security", "scanner", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
# PyYAML is required so customer-facing Hermes ~/.hermes/config.yaml audits work
# immediately after installing the pinned alpha.
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]

[project.scripts]
mcpsec = "mcpsec.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
