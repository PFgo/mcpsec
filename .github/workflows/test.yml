name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke test (insecure config — exits 1 on findings, tolerated)
        run: PYTHONPATH=src python -m mcpsec check examples/insecure.mcp.json || true
      - name: CLI smoke test (clean config — must exit 0)
        run: PYTHONPATH=src python -m mcpsec check examples/clean.mcp.json
      - name: CLI smoke test (review markdown)
        run: PYTHONPATH=src python -m mcpsec review examples/insecure.mcp.json --format markdown
      - name: CLI smoke test (review JSON)
        run: PYTHONPATH=src python -m mcpsec review examples/insecure.mcp.json --format json | python -m json.tool >/dev/null
      - name: CLI smoke test (review JSON alias)
        run: PYTHONPATH=src python -m mcpsec review examples/insecure.mcp.json --json | python -m json.tool >/dev/null
